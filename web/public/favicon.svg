<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BulkScrubsDirect">
  <!--
    The BSD monogram, matching the header lockup. Placeholder until the client
    supplies the real mark (materials request §3).

    Theme-aware: a browser tab strip is dark in dark mode, and a near-black
    monogram on it is invisible. currentColor plus a prefers-color-scheme rule
    keeps the mark legible either way.
  -->
  <style>
    :root { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f2ee; } }
  </style>
  <rect x="3" y="3" width="58" height="58" rx="12"
        fill="none" stroke="currentColor" stroke-width="4" opacity="0.3" />
  <text x="32" y="41.5" text-anchor="middle" fill="currentColor"
        font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.5">BSD</text>
</svg>
